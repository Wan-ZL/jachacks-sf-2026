<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CareGraph — Doctor Report</title>
<link rel="stylesheet" href="app.css">
<style>
  .page { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
  header.report h1 { margin-bottom: 2px; }
  .toolbar { display: flex; gap: 10px; margin: 14px 0 18px; }
  .summary h2 { margin-top: 1em; }
  .summary ul { margin: 0 0 0.75em; padding-left: 1.3em; }
  .summary li { margin-bottom: 4px; }
  .legend { display: flex; gap: 18px; font-size: 0.88rem; color: var(--ink-2); margin: 4px 0 10px; }
  .legend span::before {
    content: ""; display: inline-block; width: 12px; height: 12px;
    border-radius: 3px; margin-right: 6px; vertical-align: -1px;
  }
  .legend .k-repeat::before { background: var(--blue); }
  .legend .k-conf::before { background: var(--red); }
  svg text { font-family: inherit; font-size: 12px; fill: var(--ink-2); }
  .gridline { stroke: #e6e8ee; stroke-width: 1; }
  .axisline { stroke: #c9cdd8; stroke-width: 1; }
  .provenance { font-size: 0.82rem; }
  @media print {
    body { background: #fff; }
    .btn, .toolbar { display: none !important; }
    .card { box-shadow: none; border: 1px solid #ddd; page-break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="report card">
    <h1>Clinical Memory Report</h1>
    <p class="muted" id="patient-line">Patient: —</p>
    <div class="toolbar">
      <button class="btn" id="regen">Regenerate</button>
      <button class="btn secondary" onclick="window.print()">Print</button>
    </div>
    <p class="muted" id="status">Loading report…</p>
  </header>

  <section class="card">
    <h2>Weekly trends</h2>
    <div class="legend">
      <span class="k-repeat">Repeated questions</span>
      <span class="k-conf">Name confusions</span>
    </div>
    <div id="chart"></div>
  </section>

  <section class="card summary">
    <h2>Clinical summary</h2>
    <div id="content" class="summary-body"><p class="muted">—</p></div>
  </section>

  <p class="provenance muted" id="provenance"></p>
  <footer class="muted">Demo data — simulated. No audio is stored — only text.</footer>
</div>

<script>
const API = new URLSearchParams(location.search).get('api') || ((location.protocol.startsWith('http') && location.port !== '8080') ? location.origin : null) || localStorage.getItem('api') || 'http://localhost:8000';
const WALKER = n => API + '/walker/' + n;
async function callWalker(name, body = {}) {
  const r = await fetch(WALKER(name), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(name + ' ' + r.status);
  const j = await r.json();
  const rep=(j.data&&j.data.reports)||j.reports; return rep?(rep[0]??j):j;
}

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// Minimal markdown-ish rendering: headings, bullets, bold, paragraphs.
function renderMarkdown(md) {
  const lines = esc(md || '').split(/\r?\n/);
  let html = '', inList = false;
  for (const raw of lines) {
    const line = raw.trim();
    const bullet = line.match(/^[-*]\s+(.*)/);
    const heading = line.match(/^(#{1,4})\s+(.*)/);
    if (bullet) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += '<li>' + inline(bullet[1]) + '</li>';
      continue;
    }
    if (inList) { html += '</ul>'; inList = false; }
    if (heading) {
      const lvl = Math.min(heading[1].length + 1, 4);
      html += '<h' + lvl + '>' + inline(heading[2]) + '</h' + lvl + '>';
    } else if (line) {
      html += '<p>' + inline(line) + '</p>';
    }
  }
  if (inList) html += '</ul>';
  return html || '<p class="muted">No summary content.</p>';
  function inline(s) { return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
}

// Bar with rounded top corners (r=4), flat baseline end.
function barPath(x, y, w, h, r) {
  r = Math.min(r, w / 2, h);
  return 'M' + x + ' ' + (y + h) + ' v' + (-(h - r)) +
    ' q0 ' + (-r) + ' ' + r + ' ' + (-r) + ' h' + (w - 2 * r) +
    ' q' + r + ' 0 ' + r + ' ' + r + ' v' + (h - r) + ' Z';
}

function renderChart(weekly) {
  const el = document.getElementById('chart');
  if (!Array.isArray(weekly) || weekly.length === 0) {
    el.innerHTML = '<p class="muted">No weekly data available.</p>';
    return;
  }
  const W = 720, H = 260, m = { top: 12, right: 12, bottom: 34, left: 40 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const maxVal = Math.max(1, ...weekly.map(w => Math.max(+w.repeat_q || 0, +w.confusions || 0)));
  const yMax = Math.ceil(maxVal / 4) * 4 || 4;
  const y = v => m.top + ih - (v / yMax) * ih;
  const slot = iw / weekly.length;
  const barW = Math.min(26, (slot - 24) / 2);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" width="100%" ' +
    'aria-label="Weekly counts of repeated questions and name confusions">';
  for (let t = 0; t <= 4; t++) {
    const v = (yMax / 4) * t, gy = y(v);
    s += '<line class="gridline" x1="' + m.left + '" x2="' + (W - m.right) +
      '" y1="' + gy + '" y2="' + gy + '"/>' +
      '<text x="' + (m.left - 8) + '" y="' + (gy + 4) + '" text-anchor="end">' + v + '</text>';
  }
  weekly.forEach((wk, i) => {
    const cx = m.left + slot * i + slot / 2;
    const series = [
      { v: +wk.repeat_q || 0, c: 'var(--blue)', n: 'Repeated questions' },
      { v: +wk.confusions || 0, c: 'var(--red)', n: 'Name confusions' }
    ];
    series.forEach((sr, k) => {
      const bx = cx - barW - 1 + k * (barW + 2); // 2px gap between the pair
      const by = y(sr.v), bh = m.top + ih - by;
      if (bh > 0) {
        s += '<path d="' + barPath(bx, by, barW, bh, 4) + '" fill="' + sr.c + '">' +
          '<title>' + esc(wk.week) + ' — ' + sr.n + ': ' + sr.v + '</title></path>';
      }
      s += '<text x="' + (bx + barW / 2) + '" y="' + (y(sr.v) - 5) +
        '" text-anchor="middle">' + sr.v + '</text>';
    });
    s += '<text x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle">' +
      esc(wk.week) + '</text>';
  });
  s += '<line class="axisline" x1="' + m.left + '" x2="' + (W - m.right) +
    '" y1="' + (m.top + ih) + '" y2="' + (m.top + ih) + '"/></svg>';
  el.innerHTML = s;
}

async function load() {
  const status = document.getElementById('status');
  const btn = document.getElementById('regen');
  status.textContent = 'Generating report…';
  btn.disabled = true;
  try {
    const data = await callWalker('doctor_report') || {};
    const name = data.patient || data.patient_name || 'CareGraph patient';
    document.getElementById('patient-line').textContent = 'Patient: ' + name;
    document.getElementById('content').innerHTML = renderMarkdown(data.content);
    renderChart(data.weekly);
    const ts = data.generated || data.ts || new Date().toISOString();
    document.getElementById('provenance').textContent =
      'Generated ' + ts + ' · CareGraph — data source: L1 wearable transcripts + ' +
      'L2 caregiver observations (simulated demo data)';
    status.textContent = '';
  } catch (e) {
    status.textContent = 'Could not load report: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('regen').addEventListener('click', load);
load();
</script>
</body>
</html>
