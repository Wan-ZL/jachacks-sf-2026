<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CareGraph — Companion</title>
<link rel="stylesheet" href="app.css">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--cream-bg); background-attachment: fixed; color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  #bigbtn {
    width: 60vmin; height: 60vmin; border-radius: 50%;
    border: none; outline: none; cursor: pointer;
    background: #fffdf7; color: #6b5d4b;
    font-size: calc(12px + 2.4vmin); font-family: inherit;
    box-shadow: 0 8px 28px rgba(120,90,50,0.12);
    transition: background 0.4s ease, color 0.4s ease;
  }
  #bigbtn:focus-visible { box-shadow: 0 0 0 4px #b8d4c2, 0 8px 28px rgba(120,90,50,0.12); }
  #bigbtn.recording {
    background: #cfe8d6; color: #3d6b4c;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(111, 173, 134, 0.35); }
    50%      { box-shadow: 0 0 0 4vmin rgba(111, 173, 134, 0.0); }
  }
  #hint {
    min-height: 1.5em; margin-top: 3vmin; font-size: 15px; color: #a99878;
    opacity: 0; transition: opacity 0.5s;
  }
  #hint.show { opacity: 1; }
  #lastline {
    position: fixed; bottom: 64px; left: 0; right: 0; text-align: center;
    padding: 0 24px; color: #8a7a66;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  #lastline .tl { font-size: 19px; line-height: 1.45; max-width: 720px; }
  #lastline .tl.old4 { opacity: .28; }
  #lastline .tl.old3 { opacity: .42; }
  #lastline .tl.old2 { opacity: .60; }
  #lastline .tl.old1 { opacity: .80; }
  #lastline .tl.interim { opacity: .55; font-style: italic; color: #baab90; }
  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: #fffdf7; color: #4a7a5a; font-size: 13px;
    padding: 6px 16px; border-radius: 999px;
    box-shadow: 0 4px 20px rgba(120,90,50,0.10);
    opacity: 0; transition: opacity 0.4s; pointer-events: none;
  }
  #toast.show { opacity: 1; }
  #fallback { display: none; text-align: center; padding: 0 24px; }
  #fallback p { color: #8a7a66; font-size: 15px; }
  #fallback input {
    font-size: 18px; padding: 14px 16px; width: min(70vw, 380px);
    border: none; border-radius: 12px; font-family: inherit;
    background: #fffdf7; color: #4a3f33;
    box-shadow: 0 4px 20px rgba(120,90,50,0.10);
  }
  #fallback button {
    font-size: 18px; padding: 14px 28px; margin-left: 8px;
    border: none; border-radius: 12px; background: #cfe8d6; color: #3d6b4c;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 4px 20px rgba(120,90,50,0.10);
  }
  footer {
    position: fixed; bottom: 16px; left: 0; right: 0; text-align: center;
    font-size: 12px; color: #c3b499; padding: 0 24px;
  }
  #home {
    position: fixed; top: 14px; left: 14px; z-index: 5;
    font-size: 13px; color: #4a3f33; text-decoration: none;
    padding: 6px 8px; opacity: 0.4;
    transition: opacity 0.3s;
  }
  #home:hover, #home:focus-visible { opacity: 1; }
  #home.holding, #fallback button.holding { opacity: 1; transform: scale(.96); }
</style>
</head>
<body>

<a id="home" href="home.html" title="Hold to go home">‹ CareGraph</a>

<div id="toast">✓ remembered</div>

<button id="bigbtn" aria-label="Hold to listen">Hold to listen</button>
<div id="hint">hold the button</div>

<div id="fallback">
  <p>Voice needs Chrome/Android. Type instead:</p>
  <input id="ftext" placeholder="What was said…" autocomplete="off">
  <button id="fsend">Send</button>
</div>

<div id="lastline"></div>
<footer>Demo data — simulated. No audio is stored — only text. · Jac walkers on duty: Ingest · Recall · Drift · Critique · Handoff — the graph is the database.</footer>

<script>
const API = new URLSearchParams(location.search).get('api') || ((location.protocol.startsWith('http') && location.port !== '8080') ? location.origin : null) || localStorage.getItem('api') || 'http://localhost:8000';
const WALKER = n => API + '/walker/' + n;
const CG_IDENT = { type: 'username', value: 'caregraph-demo' };
const CG_CRED = { type: 'password', password: 'caregraph-demo-2026' };
const CG_TKEY = 'cg_token:' + API;
async function cgToken(force) {
  if (!force) { const t = localStorage.getItem(CG_TKEY); if (t) return t; }
  try {
    await fetch(API + '/user/register', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identities: [CG_IDENT], credential: CG_CRED }) });
  } catch (e) {}
  try {
    const r = await fetch(API + '/user/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identity: CG_IDENT, credential: CG_CRED }) });
    const j = await r.json();
    const t = (j.data && j.data.token) || j.token || '';
    if (t) { localStorage.setItem(CG_TKEY, t); return t; }
  } catch (e) {}
  return '';
}
function cgHeaders(tok) {
  return Object.assign({ 'Content-Type': 'application/json' }, tok ? { 'Authorization': 'Bearer ' + tok } : {});
}
async function callWalker(name, body = {}) {
  // Authenticated by default: the hosted sandbox rejects anonymous graph
  // writes; a per-device auto-registered demo user gives every page (and the
  // phone) the same server-side root. 401 = stale token -> re-auth once.
  let tok = await cgToken(false);
  let r = await fetch(WALKER(name), { method: 'POST', headers: cgHeaders(tok), body: JSON.stringify(body) });
  if (r.status === 401) {
    tok = await cgToken(true);
    r = await fetch(WALKER(name), { method: 'POST', headers: cgHeaders(tok), body: JSON.stringify(body) });
  }
  if (!r.ok) throw new Error(name + ' ' + r.status);
  const j = await r.json();
  const rep=(j.data&&j.data.reports)||j.reports; return rep?(rep[0]??j):j;
}
const qs = new URLSearchParams(location.search);
if (qs.get('api')) localStorage.setItem('api', qs.get('api'));

const BATCH_MS = parseInt(qs.get('batch') || '4000');
const LANG = qs.get('lang') || 'en-US';

const btn = document.getElementById('bigbtn');
const hint = document.getElementById('hint');
const lastline = document.getElementById('lastline');
// Rolling captions: last 4 final lines + the live interim line (5 max);
// older lines fade upward and vanish.
const tlFinals = [];
function renderTranscript(interim) {
  const finals = tlFinals.slice(interim && interim.trim() ? -4 : -5);
  const parts = finals.map((l, i) => {
    const age = finals.length - i;  // 1 = newest final
    return '<div class="tl old' + age + '">' + l.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</div>';
  });
  if (interim && interim.trim()) {
    parts.push('<div class="tl interim">' + interim.trim().replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</div>');
  }
  lastline.innerHTML = parts.join('');
}
const toast = document.getElementById('toast');

let recording = false;
let buffer = [];          // final transcript lines waiting to ship
let rec = null;
let batchTimer = null;
let toastTimer = null;

function showToast() {
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1500);
}
let hintTimer = null;
function showHint() {
  hint.classList.add('show');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => hint.classList.remove('show'), 1800);
}

// --- shipping: never lose the buffer on failure ---
let shipping = false;
async function ship() {
  if (buffer.length === 0 || shipping) return;
  shipping = true;
  const batch = buffer;
  buffer = [];
  try {
    await callWalker('ingest_batch', {
      source: 'L1_wearable',
      text: batch.join(' '),
      ts: new Date().toISOString()
    });
    showToast();
  } catch (e) {
    buffer = batch.concat(buffer);        // requeue — transcript is never lost
    setTimeout(ship, 3000);               // retry even if the batch timer stopped
  } finally {
    shipping = false;
  }
}

// --- speech recognition with essential auto-restart loop ---
const SR = window.webkitSpeechRecognition || window.SpeechRecognition;

function startRecognition() {
  rec = new SR();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = LANG;
  rec.onresult = ev => {
    // Stream: interim hypotheses render live (grey italic); finals solidify
    // and enter the ship buffer. Only finals are ever sent to the server.
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) {
        const line = t.trim();
        if (line) { buffer.push(line); tlFinals.push(line); }
      } else {
        interim += t;
      }
    }
    renderTranscript(interim);
  };
  rec.onend = () => {
    // Chrome halts recognition periodically — restart while recording
    if (recording) { try { rec.start(); } catch (e) { setTimeout(() => { if (recording) startRecognition(); }, 300); } }
  };
  rec.onerror = () => {}; // onend fires after; restart loop handles it
  try { rec.start(); } catch (e) {}
}

function setRecording(on) {
  recording = on;
  btn.classList.toggle('recording', on);
  btn.textContent = on ? 'Listening…' : 'Hold to listen';
  if (on) {
    startRecognition();
    batchTimer = setInterval(ship, BATCH_MS);
  } else {
    clearInterval(batchTimer);
    if (rec) { try { rec.stop(); } catch (e) {} rec = null; }
    ship(); // flush on stop
  }
}

// --- long-press (600ms) toggles; short tap just hints ---
const HOLD_MS = 600;
let holdTimer = null;
let fired = false;

function pressStart() {
  fired = false;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => { fired = true; setRecording(!recording); }, HOLD_MS);
}
function pressEnd() {
  clearTimeout(holdTimer);
  if (!fired) showHint();
}
btn.addEventListener('pointerdown', e => { e.preventDefault(); pressStart(); });
btn.addEventListener('pointerup', pressEnd);
btn.addEventListener('pointercancel', pressEnd);
btn.addEventListener('pointerleave', () => clearTimeout(holdTimer));
btn.addEventListener('contextmenu', e => e.preventDefault());

// keyboard fallback: hold Space
let spaceDown = false;
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && !spaceDown) { spaceDown = true; e.preventDefault(); pressStart(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') { spaceDown = false; e.preventDefault(); pressEnd(); }
});

// --- unsupported (iOS Safari): text fallback ---
if (!SR) {
  btn.style.display = 'none';
  hint.style.display = 'none';
  document.getElementById('fallback').style.display = 'block';
  const ftext = document.getElementById('ftext');
  const send = () => {
    const v = ftext.value.trim();
    if (!v) return;
    buffer.push(v);
    tlFinals.push(v); renderTranscript('');
    ftext.value = '';
    ship();
  };
  longPressify(document.getElementById('fsend'), send);  // anti-mistouch
  ftext.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
}

// Anti-mistouch: every control on the patient page requires a LONG PRESS
// (600ms) — including the home link and the fallback send button.
function longPressify(el, action) {
  if (!el) return;
  let t = null;
  const cancel = () => { if (t) { clearTimeout(t); t = null; el.classList.remove('holding'); } };
  el.addEventListener('click', e => e.preventDefault());
  el.addEventListener('pointerdown', e => {
    e.preventDefault();
    el.classList.add('holding');
    t = setTimeout(() => { cancel(); action(); }, 600);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => el.addEventListener(ev, cancel));
}
longPressify(document.getElementById('home'), () => { location.href = 'home.html'; });
</script>
</body>
</html>
