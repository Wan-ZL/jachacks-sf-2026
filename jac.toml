[project]
name = "caregraph"
version = "0.1.0"
entry_point = "main.jac"
# Pure API service: all UI is static files in assets/ served by the same jac
# server — no client codespace, no npm/vite pipeline needed.
kind = "api-service"

[serve]
port = 8000

[plugins.client.assets]
custom_extensions = [".html", ".css", ".js", ".json", ".png", ".jpg", ".svg", ".ico", ".woff", ".woff2", ".webp"]

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
zod = "^4.3.6"
"@hookform/resolvers" = "^5.2.2"
"@tanstack/react-form" = "*"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

# NOTE: do NOT pip-install byllm here — the hosted runtime bundles byLLM in
# jaclang core, and its compiler cannot parse the legacy pip package.
# Model loading is runtime-adaptive in llm_backend.py.

[jacpack]
name = 'jachacks-sf-2026-v2'
description = 'Jac IDE snapshot for jachacks-sf-2026-v2'
